<style>
  :root {
    --bg:#0d0d12; --panel:#13131a; --panel-2:#1a1a24; --panel-3:#202030;
    --border:#2a2a3a; --border-2:#33334a; --text:#f1f1f5; --muted:#6b7280; --muted-2:#9095a3;
    --accent:#4F8EF7; --accent-2:#A855F7; --danger:#ef4444; --good:#22c55e; --warn:#eab308;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
    --sans:-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  .page {
    font-family:var(--sans); color:var(--text); min-height:100%;
    background:
      radial-gradient(1100px 560px at 82% -6%, rgba(79,142,247,.10), transparent 60%),
      radial-gradient(820px 480px at -6% 3%, rgba(168,85,247,.08), transparent 55%),
      #08080c;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    padding:34px 16px 26px;
  }
  .page-head { text-align:center; margin-bottom:22px; max-width:52ch; }
  .page-head .eyebrow {
    font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
    font-weight:600; margin:0 0 8px;
  }
  .page-head h1 { font-size:23px; margin:0 0 8px; font-weight:700; letter-spacing:-.02em; }
  .page-head p { font-size:13.5px; color:var(--muted-2); margin:0; line-height:1.5; }
  .page-head b { color:var(--text); font-weight:600; }

  /* ── device ─────────────────────────────────── */
  .device {
    width:392px; max-width:100%; height:812px; border-radius:46px; flex:none;
    background:#04040a; padding:12px; border:1px solid #23232e;
    box-shadow:0 46px 90px -36px #000;
  }
  .screen {
    width:100%; height:100%; border-radius:34px; overflow:hidden; position:relative;
    background:var(--bg); display:flex; flex-direction:column;
  }
  .notch { position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:128px; height:26px; background:#04040a; border-radius:0 0 16px 16px; z-index:60; }
  @media (max-width:470px){
    .page { padding:0; }
    .page-head { display:none; }
    .device { width:100%; height:100vh; height:100dvh; border-radius:0; border:0; padding:0; }
    .screen { border-radius:0; }
    .notch { display:none; }
  }

  /* ── status + app bars ──────────────────────── */
  .statusbar {
    height:38px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px 0 22px; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums;
  }
  .statusbar .r { display:flex; align-items:center; gap:6px; }
  .statusbar svg { width:16px; height:16px; }

  .appbar {
    flex:none; min-height:52px; display:flex; align-items:center; gap:9px; padding:7px 12px;
    border-bottom:1px solid var(--border); background:var(--panel);
  }
  .brand-mark {
    width:30px; height:30px; border-radius:9px; flex:none; color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
  }
  .appbar .title { font-size:16px; font-weight:650; flex:1; letter-spacing:-.01em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .appbar .subttl { font-size:11px; color:var(--muted); font-weight:400; }
  .ibtn {
    width:36px; height:36px; border-radius:10px; border:0; background:none; color:var(--muted-2);
    display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; flex:none;
  }
  .ibtn:active { background:var(--panel-2); }
  .ibtn svg { width:20px; height:20px; }
  .ibtn.back svg { width:22px; height:22px; color:var(--text); }
  .badge-sm {
    position:absolute; top:3px; right:3px; min-width:16px; height:16px; padding:0 4px;
    border-radius:999px; background:var(--danger); color:#fff; font-size:10px; font-weight:700;
    font-family:var(--mono); display:flex; align-items:center; justify-content:center;
    border:2px solid var(--panel);
  }

  /* ── service rail ───────────────────────────── */
  .rail { flex:none; display:flex; gap:3px; overflow-x:auto; padding:11px 8px;
    background:var(--panel); border-bottom:1px solid var(--border); scrollbar-width:none; }
  .rail::-webkit-scrollbar { display:none; }
  .svc { flex:none; width:60px; display:flex; flex-direction:column; align-items:center; gap:5px;
    background:none; border:0; cursor:pointer; padding:2px 0; font-family:var(--sans); }
  .svc-av { position:relative; width:44px; height:44px; border-radius:14px; color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
    transition:box-shadow .16s ease; }
  .svc-av .cnt { position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 5px;
    border-radius:999px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:700;
    font-family:var(--mono); display:flex; align-items:center; justify-content:center; border:2px solid var(--panel); }
  .svc-nm { font-size:10.5px; color:var(--muted); max-width:58px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .svc.on .svc-nm { color:var(--text); font-weight:600; }
  .svc.all .svc-av { background:var(--panel-3); border:1.5px dashed var(--border); color:var(--muted-2); }
  .svc.all .svc-av .cnt { background:var(--muted); }

  /* ── filter chips ───────────────────────────── */
  .filters { flex:none; display:flex; gap:6px; overflow-x:auto; padding:10px 12px;
    border-bottom:1px solid var(--border); scrollbar-width:none; background:var(--panel-2); }
  .filters::-webkit-scrollbar { display:none; }
  .chip { flex:none; font-size:12.5px; font-weight:500; padding:5px 11px; border-radius:999px;
    background:var(--panel); border:1px solid var(--border); color:var(--muted-2); cursor:pointer; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip .c { font-family:var(--mono); opacity:.8; margin-left:3px; }

  /* ── scroll body ────────────────────────────── */
  .body { flex:1; overflow-y:auto; overflow-x:hidden; background:var(--bg); }
  .body::-webkit-scrollbar { width:0; }
  .pad { padding:14px; }
  .sec-title { font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
    font-weight:600; margin:2px 2px 10px; }

  /* ── dialog rows ────────────────────────────── */
  .row { display:flex; gap:11px; padding:12px 14px; border-bottom:1px solid rgba(42,42,58,.5);
    align-items:flex-start; cursor:pointer; }
  .row:active { background:var(--panel-2); }
  .row-av { width:42px; height:42px; border-radius:50%; flex:none; color:#fff; position:relative;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
  .row-av .stag { position:absolute; bottom:-1px; right:-1px; width:13px; height:13px; border-radius:50%; border:2px solid var(--bg); }
  .row-main { flex:1; min-width:0; }
  .row-top { display:flex; align-items:baseline; gap:8px; }
  .row-nm { font-size:14px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-time { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
  .row-prev { font-size:12.5px; color:var(--muted-2); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-meta { display:flex; align-items:center; gap:7px; margin-top:6px; }
  .pill { font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px; line-height:1.5; }
  .pill.queue{ background:rgba(239,68,68,.14); color:#f87171; }
  .pill.ai{ background:rgba(79,142,247,.14); color:#7BA8F9; }
  .pill.work{ background:rgba(34,197,94,.14); color:#4ade80; }
  .pill.wait{ background:rgba(234,179,8,.14); color:#facc15; }
  .pill.closed{ background:var(--panel-3); color:var(--muted); }
  .unread { margin-left:auto; min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    background:var(--accent); color:#fff; font-size:11px; font-weight:700; font-family:var(--mono);
    display:flex; align-items:center; justify-content:center; }
  .called { color:var(--danger); }

  /* ── chat ───────────────────────────────────── */
  .chat { flex:1; overflow-y:auto; padding:14px 12px 6px; display:flex; flex-direction:column; gap:8px; background:var(--bg); }
  .chat::-webkit-scrollbar { width:0; }
  .msg { max-width:82%; font-size:13.5px; line-height:1.45; padding:9px 12px; border-radius:16px; }
  .msg.user { align-self:flex-start; background:var(--panel-2); border-top-left-radius:6px; }
  .msg.op { align-self:flex-end; background:linear-gradient(135deg,#3a2a5c,#2e2350); border-top-right-radius:6px; }
  .msg.ai { align-self:flex-start; background:rgba(79,142,247,.12); border:1px solid rgba(79,142,247,.2); border-top-left-radius:6px; }
  .msg .mt { font-size:10px; color:var(--muted); margin-top:4px; text-align:right; }
  .msg.ai .who { font-size:10px; font-weight:700; color:#7BA8F9; margin-bottom:3px; }
  .sys { align-self:center; font-size:11px; color:var(--muted); background:var(--panel-2);
    padding:4px 12px; border-radius:999px; margin:2px 0; }
  .replybar { flex:none; border-top:1px solid var(--border); background:var(--panel); padding:9px 10px;
    display:flex; align-items:center; gap:8px; }
  .replybar input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:20px;
    padding:9px 14px; color:var(--text); font:inherit; font-size:13.5px; outline:none; }
  .replybar input:focus { border-color:rgba(79,142,247,.5); }
  .send { width:38px; height:38px; border-radius:50%; border:0; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .send:active { background:#3d7ce8; }

  /* ── bottom nav ─────────────────────────────── */
  .bottomnav { flex:none; display:flex; border-top:1px solid var(--border); background:var(--panel);
    padding:6px 4px 10px; }
  .navbtn { flex:1; background:none; border:0; color:var(--muted); display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:6px 0; cursor:pointer; font-family:var(--sans); position:relative; }
  .navbtn svg { width:22px; height:22px; }
  .navbtn span { font-size:10.5px; font-weight:500; }
  .navbtn.on { color:var(--accent); }
  .navbtn .nb { position:absolute; top:2px; right:calc(50% - 20px); min-width:15px; height:15px; padding:0 4px;
    border-radius:999px; background:var(--danger); color:#fff; font-size:9.5px; font-weight:700; font-family:var(--mono);
    display:flex; align-items:center; justify-content:center; border:2px solid var(--panel); }

  /* ── cards / stats ──────────────────────────── */
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi { background:var(--panel); border:1px solid var(--border); border-radius:13px; padding:13px; }
  .kpi .l { font-size:11.5px; color:var(--muted); margin-bottom:7px; }
  .kpi .v { font-size:22px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .kpi .v small { font-size:12px; color:var(--muted); font-weight:500; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:15px; margin-top:12px; }
  .card h3 { margin:0 0 3px; font-size:14px; font-weight:650; }
  .card .cap { font-size:11.5px; color:var(--muted); margin-bottom:12px; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:88px; }
  .bar { flex:1; background:linear-gradient(180deg,#4F8EF7,#3567c9); border-radius:3px 3px 0 0; min-height:3px; }
  .bar:last-child { background:linear-gradient(180deg,#A855F7,#7c3aed); }
  .tq { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .tq .qn { font-size:10px; color:var(--muted); width:12px; font-variant-numeric:tabular-nums; }
  .tq .qbar { flex:1; }
  .tq .qtop { display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; }
  .tq .qtrack { height:6px; background:var(--bg); border-radius:99px; overflow:hidden; }
  .tq .qfill { height:100%; background:var(--accent); border-radius:99px; }
  .oprow { display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid rgba(42,42,58,.5); }
  .oprow:last-child { border-bottom:0; }
  .op-av { width:34px; height:34px; border-radius:50%; color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .oprow .oi { flex:1; min-width:0; }
  .oprow .on { font-size:13.5px; font-weight:600; }
  .oprow .os { font-size:11px; color:var(--muted); }
  .oprow .metric { text-align:right; font-size:12px; }
  .oprow .metric b { display:block; font-variant-numeric:tabular-nums; }
  .dotstat { display:inline-flex; align-items:center; gap:5px; font-size:11px; }
  .dotstat i { width:7px; height:7px; border-radius:50%; }

  /* ── settings ───────────────────────────────── */
  .svc-banner { display:flex; align-items:center; gap:11px; margin:14px 14px 6px; padding:12px 13px;
    background:var(--panel); border:1px solid var(--border); border-radius:13px; }
  .svc-banner .sb-av { width:38px; height:38px; border-radius:11px; color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-weight:700; }
  .svc-banner .sb-t { font-size:14px; font-weight:650; }
  .svc-banner .sb-s { font-size:11.5px; color:var(--muted); font-family:var(--mono); }
  .setgroup { margin:16px 14px 0; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; overflow:hidden; }
  .setrow { display:flex; align-items:center; gap:12px; padding:14px; border-bottom:1px solid var(--border); cursor:pointer; }
  .setrow:last-child { border-bottom:0; }
  .setrow:active { background:var(--panel-2); }
  .setrow .sicon { width:32px; height:32px; border-radius:9px; background:var(--panel-2); flex:none;
    display:flex; align-items:center; justify-content:center; color:var(--muted-2); }
  .setrow .sicon svg { width:18px; height:18px; }
  .setrow .st { flex:1; min-width:0; }
  .setrow .st .t { font-size:14px; font-weight:550; }
  .setrow .st .d { font-size:11.5px; color:var(--muted); margin-top:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .setrow .chev { color:var(--muted); }
  .setrow .rcnt { font-size:11px; color:var(--muted); font-family:var(--mono); background:var(--panel-2);
    padding:2px 8px; border-radius:999px; }

  .field { margin:16px 14px 0; }
  .field > label { display:block; font-size:12px; color:var(--muted); margin-bottom:7px; font-weight:500; }
  .field textarea, .field input[type=text], .field select {
    width:100%; background:var(--panel); border:1px solid var(--border); border-radius:11px;
    padding:12px; color:var(--text); font:inherit; font-size:13.5px; outline:none; resize:vertical; }
  .field textarea:focus, .field input:focus, .field select:focus { border-color:rgba(79,142,247,.5); }
  .toggle-row { display:flex; align-items:center; gap:12px; padding:14px; }
  .toggle-row .tinfo { flex:1; }
  .toggle-row .tt { font-size:13.5px; font-weight:550; }
  .toggle-row .td { font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.4; }
  .switch { width:44px; height:26px; border-radius:99px; background:var(--panel-3); position:relative;
    flex:none; cursor:pointer; transition:background .18s ease; border:1px solid var(--border); }
  .switch.on { background:var(--accent); border-color:var(--accent); }
  .switch::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:#fff; transition:transform .18s ease; }
  .switch.on::after { transform:translateX(18px); }
  .slider-row { padding:16px 14px; }
  .slider-row .stop { display:flex; justify-content:space-between; font-size:13px; margin-bottom:12px; }
  .slider-row .sval { font-family:var(--mono); color:var(--accent); }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .daychip { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); }
  .daychip:last-child { border-bottom:0; }
  .daychip .dn { width:44px; font-size:13px; font-weight:600; }
  .daychip .times { flex:1; font-family:var(--mono); font-size:12.5px; color:var(--muted-2); }
  .daychip.off .times { opacity:.4; }
  .tmpl { padding:13px 14px; border-bottom:1px solid var(--border); }
  .tmpl:last-child { border-bottom:0; }
  .tmpl .tt { font-size:13.5px; font-weight:600; margin-bottom:3px; }
  .tmpl .tx { font-size:12px; color:var(--muted-2); line-height:1.45; }
  .grp-h { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent);
    font-weight:600; margin:16px 16px 6px; }
  .kbrow { padding:13px 14px; border-bottom:1px solid var(--border); }
  .kbrow:last-child { border-bottom:0; }
  .kbrow .kt { font-size:13.5px; font-weight:600; }
  .kbrow .kmeta { display:flex; gap:8px; align-items:center; margin-top:5px; }
  .kbrow .kcat { font-size:10.5px; background:var(--panel-2); color:var(--muted-2); padding:2px 8px; border-radius:999px; }
  .kbrow .kkw { font-size:11px; color:var(--muted); font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn-primary { display:block; width:calc(100% - 28px); margin:16px 14px; padding:13px; border-radius:12px;
    background:var(--accent); color:#fff; border:0; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-primary:active { background:#3d7ce8; }
  .btn-ghost { display:flex; align-items:center; justify-content:center; gap:8px; width:calc(100% - 28px);
    margin:12px 14px 0; padding:12px; border-radius:12px; background:var(--panel); border:1px dashed var(--border);
    color:var(--muted-2); font:inherit; font-size:13.5px; cursor:pointer; }

  /* ── servers ────────────────────────────────── */
  .srv { background:var(--panel); border:1px solid var(--border); border-radius:13px; padding:14px; margin-bottom:11px; }
  .srv.down { border-color:rgba(239,68,68,.25); }
  .srv-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
  .srv-nm { display:flex; align-items:center; gap:9px; font-weight:600; font-size:14px; }
  .srv-nm .sd { width:9px; height:9px; border-radius:50%; }
  .srv-st { font-size:12px; font-weight:600; }
  .srv-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center; }
  .srv-grid .m { background:var(--bg); border-radius:9px; padding:8px 4px; }
  .srv-grid .ml { font-size:10.5px; color:var(--muted); margin-bottom:3px; }
  .srv-grid .mv { font-size:14px; font-weight:650; font-variant-numeric:tabular-nums; }
  .srv-loc { font-size:11px; color:var(--muted); margin-top:9px; }

  /* ── sheets ─────────────────────────────────── */
  .backdrop { position:absolute; inset:0; background:rgba(3,3,6,.6); z-index:40; opacity:0;
    pointer-events:none; transition:opacity .22s ease; }
  .backdrop.on { opacity:1; pointer-events:auto; }
  .sheet { position:absolute; left:0; right:0; bottom:0; z-index:41; background:var(--panel);
    border-radius:22px 22px 0 0; border-top:1px solid var(--border); transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1); max-height:86%; display:flex; flex-direction:column; }
  .sheet.on { transform:none; }
  .grabber { width:38px; height:4px; border-radius:99px; background:#3a3a4a; margin:8px auto 6px; flex:none; }
  .sheet-scroll { overflow-y:auto; padding:6px 0 20px; }
  .sheet-scroll::-webkit-scrollbar { width:0; }
  .sheet-h { padding:6px 18px 12px; display:flex; align-items:baseline; justify-content:space-between; }
  .sheet-h h3 { margin:0; font-size:17px; font-weight:650; }
  .sheet-h span { font-size:12px; color:var(--muted); }
  .sheet-row { display:flex; align-items:center; gap:12px; padding:11px 14px; margin:0 8px; border-radius:13px; cursor:pointer; }
  .sheet-row:active { background:var(--panel-2); }
  .sheet-row.on { background:rgba(79,142,247,.10); }
  .sheet-av { width:40px; height:40px; border-radius:12px; color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
  .sheet-row .info { flex:1; min-width:0; }
  .sheet-row .nm { font-size:14.5px; font-weight:600; }
  .sheet-row .sub { font-size:11.5px; color:var(--muted); font-family:var(--mono); margin-top:1px; }
  .sheet-row .cnt { font-family:var(--mono); font-size:12px; font-weight:700; min-width:22px; height:22px;
    padding:0 7px; border-radius:999px; display:flex; align-items:center; justify-content:center;
    background:var(--danger); color:#fff; }
  .sheet-row .cnt.zero { background:var(--panel-3); color:var(--muted); }
  .sheet-row .check { color:var(--accent); width:18px; height:18px; opacity:0; flex:none; }
  .sheet-row.on .check { opacity:1; }

  // ── render ────────────────────────────────────────────────────────────────
  function render(){
    var main;
    if(S.tab==="dialogs") main = S.dlg ? viewChat() : viewDialogsList();
    else if(S.tab==="stats") main = viewStats();
    else if(S.tab==="settings") main = S.setPage ? viewSetPage() : viewSettingsMenu();
    else if(S.tab==="servers") main = viewServers();

    var sheetHtml = "", sheetClass = "";
    if(S.sheet==="services"){ sheetHtml = servicesSheet(); }
    else if(S.sheet==="client"){ sheetHtml = clientSheet(); }

    screen.innerHTML = main +
      '<div class="backdrop" data-act="closeSheet"></div>'+
      '<div class="sheet">'+sheetHtml+'</div>'+
      '<div class="toast" id="toast"></div>';

    if(S.sheet){
      var bd = screen.querySelector(".backdrop"), sh = screen.querySelector(".sheet");
      requestAnimationFrame(function(){ bd.classList.add("on"); sh.classList.add("on"); });
    }
    var cs = screen.querySelector("#chatScroll");
    if(cs) cs.scrollTop = cs.scrollHeight;
  }

  function toast(msg){
    var t = screen.querySelector("#toast"); if(!t) return;
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 1900);
  }

  // ── actions ───────────────────────────────────────────────────────────────
  function handle(act, arg){
    switch(act){
      case "tab": S.tab=arg; S.dlg=null; S.setPage=null; render(); break;
      case "setService": S.service=arg; S.dlg=null; S.filter="all"; render(); break;
      case "openServices": S.sheet="services"; render(); break;
      case "pickService": S.service=arg; S.sheet=null; S.dlg=null; S.filter="all"; render(); break;
      case "closeSheet": S.sheet=null; render(); break;
      case "filter": S.filter=arg; render(); break;
      case "openDlg": S.dlg=arg; render(); break;
      case "backToList": S.dlg=null; render(); break;
      case "openClient": S.sheet="client"; render(); break;
      case "setPage": S.setPage=arg; render(); break;
      case "backToSettings": S.setPage=null; render(); break;
      case "sendReply": doSend(); break;
      case "toggle": flip(arg); render(); break;
      case "toggleDay": sched[+arg][1]=sched[+arg][1]?0:1; render(); break;
      case "temp": break;
      case "save": toast("Настройки сохранены"); break;
      case "add": toast("В демо создание отключено"); break;
      case "broadcast": toast("Рассылка запущена"); break;
      case "billing": toast(arg); if(S.sheet==="client"){ /* keep sheet */ } break;
      case "none": break;
    }
  }

  function flip(path){
    if(path.indexOf("ai.")===0) ai[path.slice(3)] = !ai[path.slice(3)];
    else if(path.indexOf("autom.")===0) autom[path.slice(6)] = !autom[path.slice(6)];
  }

  function doSend(){
    var inp = screen.querySelector("#replyInput"); if(!inp) return;
    var text = inp.value.trim(); if(!text) return;
    var d = activeDlg(); if(!d) return;
    d.msgs.push({ who:"op", text:text, time:"сейчас" });
    d.preview = text; d.time = "сейчас";
    if(d.status==="queue"||d.status==="ai"){ d.status="work"; d.called=false; }
    render();
    // client auto-reply
    var replies = ["Спасибо, сейчас попробую!","Хорошо, понял","Получилось, вы супер 🙏","Секунду, проверяю…"];
    setTimeout(function(){
      var dd = (DIALOGS[S.service]||[]).find(function(x){return x.id===d.id;});
      if(!dd) return;
      dd.msgs.push({ who:"user", text:replies[Math.floor(Math.random()*replies.length)], time:"сейчас" });
      dd.preview = dd.msgs[dd.msgs.length-1].text;
      if(S.dlg===dd.id && S.tab==="dialogs") render();
    }, 2600);
  }

  // temp slider live label (no full re-render to keep focus)
  screen.addEventListener("input", function(e){
    var t = e.target;
    if(t.dataset && t.dataset.act==="temp"){
      ai.temp = parseFloat(t.value);
      var lbl = screen.querySelector(".sval"); if(lbl) lbl.textContent = ai.temp.toFixed(1);
    }
  });
  screen.addEventListener("keydown", function(e){
    if(e.key==="Enter" && e.target.id==="replyInput"){ e.preventDefault(); doSend(); }
  });
  screen.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]"); if(!el) return;
    handle(el.dataset.act, el.dataset.arg);
  });

  render();
})();
</script>
