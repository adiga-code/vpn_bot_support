<!doctype html>
<html lang="ru">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; padding: 40px 60px; display: flex; flex-direction: column; gap: 26px; }
        #kb-head { display: flex; align-items: flex-end; justify-content: space-between; }
        #kb-upload { background: rgba(79,142,247,0.14); border: 1px solid rgba(79,142,247,0.35); color: #7ba8f9;
                     font-size: 21px; font-weight: 600; padding: 14px 24px; border-radius: 12px; }
        #kb-list { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding-bottom: 40px; }
        .kb-item { background: #13131a; border: 1px solid #2a2a3a; border-radius: 18px; padding: 22px 26px;
                   display: flex; gap: 20px; align-items: flex-start; opacity: 0; }
        .kb-ico { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 12px; background: rgba(79,142,247,0.12);
                  color: #7ba8f9; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
        .kb-title { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
        .kb-chips { display: flex; gap: 10px; margin-top: 12px; }
        .kb-chip { font-size: 17px; color: #868d99; background: #1a1a24; border: 1px solid #2a2a3a;
                   border-radius: 8px; padding: 5px 12px; opacity: 0; }
        #kb-1 { border-color: rgba(79,142,247,0.22); }
        #kb-ring { position: absolute; inset: -2px; border-radius: 20px; border: 2px solid #4f8ef7; opacity: 0; pointer-events: none; }
        #kb-1wrap { position: relative; }
      </style>

      <div id="root" data-composition-id="scr-kb" data-width="1920" data-height="960">
        <div id="kb-head">
          <div>
            <div class="scr-title">База знаний</div>
            <div class="scr-sub">24 чанка · используется ИИ для поиска</div>
          </div>
          <div id="kb-upload">Загрузить документ</div>
        </div>

        <div id="kb-list">
          <div id="kb-1wrap">
            <div class="kb-item" id="kb-1">
              <div class="kb-ico">02</div>
              <div>
                <div class="kb-title">Ограничения мобильного интернета — По Wi-Fi работает, а на мобильном нет</div>
                <div class="kb-chips">
                  <span class="kb-chip">мобильный</span>
                  <span class="kb-chip">симка</span>
                  <span class="kb-chip">LTE</span>
                  <span class="kb-chip">белые списки</span>
                </div>
              </div>
            </div>
            <div id="kb-ring"></div>
          </div>
          <div class="kb-item" id="kb-2">
            <div class="kb-ico">01</div>
            <div><div class="kb-title">Подключение — Первый запуск на телефоне</div></div>
          </div>
          <div class="kb-item" id="kb-3">
            <div class="kb-ico">03</div>
            <div><div class="kb-title">Оплата — Продление подписки и возвраты</div></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          tl.fromTo("#kb-head", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, 0.02);
          tl.fromTo("#kb-1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 0.05);
          tl.fromTo("#kb-2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 0.17);
          tl.fromTo("#kb-3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, 0.29);
          // beat-locked: global 8.96s (strong cue 1.00; scene starts at 8.44) —
          // the chunk the AI actually answered from lights up
          tl.fromTo("#kb-ring", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, 0.52);
          // beat-grid: global 9.50s — its keyword phrases follow
          tl.fromTo(".kb-chip", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out", stagger: 0.07 }, 1.06);

          // audio-reactive (subtle): the ring's glow leans on the bass
          var A = window.AUDIO_DATA, ring = document.getElementById("kb-ring");
          if (A && A.totalFrames) {
            var mk = function (i) {
              return function () {
                ring.style.boxShadow = "0 0 " + (10 + A.bass[i] * 26).toFixed(1) + "px rgba(79,142,247," + (0.25 + A.bass[i] * 0.35).toFixed(3) + ")";
              };
            };
            var base = Math.round(8.44 * A.fps);
            for (var f = 0; f < 76; f++) { tl.call(mk(base + f), [], f / A.fps); }
          }
          window.__timelines["scr-kb"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
